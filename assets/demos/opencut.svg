<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block">
  <defs>
    <style>
      .oc-bg { fill: #0a0a0a; }
      .oc-panel { fill: #111113; stroke: #1f1f23; }
      .oc-stage { fill: #1a1a1f; stroke: #2a2a30; }
      .oc-stage-on { fill: #c2410c; stroke: #fb923c; stroke-width: 2; }
      .oc-text { fill: #e6e6e6; font-family: 'SF Mono', monospace; font-size: 10px; }
      .oc-dim { fill: #64748b; font-family: 'SF Mono', monospace; font-size: 9px; }
      .oc-active { fill: #fb923c; }
      .oc-title { fill: #94a3b8; font-family: 'SF Mono', monospace; font-size: 11px; letter-spacing: 0.05em; }
      @keyframes ocScan { 0%{transform:translateX(0)} 100%{transform:translateX(720px)} }
      @keyframes ocPulse { 0%,100%{opacity:.7} 50%{opacity:1} }
      .oc-scan-line { animation: ocScan 8s linear infinite; }
      .oc-active { animation: ocPulse 0.6s ease-in-out infinite; }
    </style>
