<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block">
  <defs>
    <style>
      .vs-bg { fill: #0a0a0a; }
      .vs-panel { fill: #111113; stroke: #1f1f23; }
      .vs-title { fill: #94a3b8; font-family: 'SF Mono', monospace; font-size: 11px; letter-spacing: 0.05em; }
      .vs-text { fill: #e6e6e6; font-family: 'SF Mono', monospace; font-size: 12px; }
      .vs-dim { fill: #64748b; font-family: 'SF Mono', monospace; font-size: 11px; }
      .vs-accent { fill: #a855f7; }
      .vs-frame { fill: #1a1a1f; stroke: #2a2a30; }
      .vs-frame-h { fill: #4c1d95; stroke: #a855f7; stroke-width: 1; }
      .vs-bar { fill: #a855f7; }
      @keyframes vsWave { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
      @keyframes vsEmit { 0%{transform:translate(0,0);opacity:0} 50%{opacity:1} 100%{transform:translate(120px,-40px);opacity:0} }
      @keyframes vsGlow { 0%,100%{filter:none} 50%{filter:drop-shadow(0 0 8px #a855f7)} }
      @keyframes vsBar { 0%{transform:scaleX(0);transform-origin:left} 100%{transform:scaleX(1);transform-origin:left} }
      .vs-wave { animation: vsWave 2s ease-in-out infinite; }
      .vs-emit { animation: vsEmit 3s ease-out infinite; }
      .vs-glow { animation: vsGlow 3s ease-in-out infinite; }
      .vs-bar { animation: vsBar 5s var(--ease-out-quart, ease-out) infinite; transform-origin: left; }
    </style>
  </defs>
  <rect class="vs-bg" width="800" height="450"/>
  <text x="32" y="40" class="vs-title">VIDSLICE · INGEST PIPELINE</text>
  <text x="700" y="40" class="vs-dim">3 frames/clip · lanceDB · ed25519</text>
  <line x1="32" y1="50" x2="768" y2="50" stroke="#1f1f23"/>
  <!-- Source: video frame thumbnail with wave animation -->
  <g class="vs-glow">
    <rect x="32" y="80" width="160" height="120" rx="4" class="vs-frame"/>
    <text x="112" y="100" text-anchor="middle" class="vs-text">input.mp4</text>
    <line x1="48" y1="120" x2="176" y2="120" stroke="#a855f7" stroke-width="2" class="vs-wave" style="animation-delay:0s"/>
    <line x1="48" y1="135" x2="176" y2="135" stroke="#a855f7" stroke-width="2" class="vs-wave" style="animation-delay:0.2s"/>
    <line x1="48" y1="150" x2="176" y2="150" stroke="#a855f7" stroke-width="2" class="vs-wave" style="animation-delay:0.4s"/>
    <line x1="48" y1="165" x2="176" y2="165" stroke="#a855f7" stroke-width="2" class="vs-wave" style="animation-delay:0.6s"/>
    <text x="112" y="190" text-anchor="middle" class="vs-dim">source clip</text>
  </g>
  <!-- Arrow -->
  <line x1="200" y1="140" x2="240" y2="140" stroke="#a855f7" stroke-width="1.5"/>
  <polygon points="240,140 234,137 234,143" fill="#a855f7"/>
  <!-- Extract: 3 frames -->
  <g>
    <text x="290" y="78" class="vs-title">EXTRACT (3 frames)</text>
    <rect x="280" y="90" width="60" height="40" rx="3" class="vs-frame"/>
    <text x="310" y="113" text-anchor="middle" class="vs-dim">t=0.0s</text>
    <rect x="280" y="135" width="60" height="40" rx="3" class="vs-frame"/>
    <text x="310" y="158" text-anchor="middle" class="vs-dim">t=mid</text>
    <rect x="280" y="180" width="60" height="40" rx="3" class="vs-frame"/>
    <text x="310" y="203" text-anchor="middle" class="vs-dim">t=end</text>
  </g>
  <line x1="346" y1="140" x2="386" y2="140" stroke="#a855f7" stroke-width="1.5"/>
  <polygon points="386,140 380,137 380,143" fill="#a855f7"/>
  <!-- Embed + sign -->
  <g>
    <text x="400" y="78" class="vs-title">EMBED + SIGN</text>
    <text x="400" y="100" class="vs-text">clip · ViT-B/32 · 512-d</text>
    <text x="400" y="118" class="vs-text">phash · 64-bit · dedup</text>
    <text x="400" y="136" class="vs-text">ed25519 sig · payload hash</text>
    <text x="400" y="154" class="vs-accent">attestation: ok</text>
  </g>
  <line x1="528" y1="140" x2="568" y2="140" stroke="#a855f7" stroke-width="1.5"/>
  <polygon points="568,140 562,137 562,143" fill="#a855f7"/>
  <!-- Store: LanceDB visualization -->
  <g>
    <text x="582" y="78" class="vs-title">LANCEDB</text>
    <rect x="582" y="86" width="186" height="180" rx="4" class="vs-frame"/>
    <!-- Grid of dots, one highlighted -->
    <g>
      <circle cx="600" cy="110" r="3" fill="#a855f7" opacity="0.4"/>
      <circle cx="620" cy="110" r="3" fill="#a855f7" opacity="0.4"/>
      <circle cx="640" cy="110" r="3" fill="#a855f7" opacity="0.4"/>
      <circle cx="660" cy="110" r="3" fill="#a855f7" opacity="0.4"/>
      <circle cx="680" cy="110" r="3" fill="#a855f7" opacity="0.4"/>
      <circle cx="700" cy="110" r="3" fill="#a855f7" opacity="0.4"/>
      <circle cx="720" cy="110" r="3" fill="#a855f7" opacity="0.4"/>
      <circle cx="740" cy="110" r="3" fill="#a855f7" opacity="0.4"/>
      <circle cx="600" cy="130" r="3" fill="#a855f7" opacity="0.4"/>
      <circle cx="620" cy="130" r="3" fill="#22c55e">
        <animate attributeName="r" values="3;7;3" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="640" cy="130" r="3" fill="#a855f7" opacity="0.4"/>
      <circle cx="660" cy="130" r="3" fill="#a855f7" opacity="0.4"/>
      <circle cx="680" cy="130" r="3" fill="#a855f7" opacity="0.4"/>
      <circle cx="700" cy="130" r="3" fill="#22c55e">
        <animate attributeName="r" values="3;6;3" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="720" cy="130" r="3" fill="#a855f7" opacity="0.4"/>
      <circle cx="740" cy="130" r="3" fill="#a855f7" opacity="0.4"/>
      <circle cx="600" cy="150" r="3" fill="#a855f7" opacity="0.4"/>
      <circle cx="620" cy="150" r="3" fill="#a855f7" opacity="0.4"/>
      <circle cx="640" cy="150" r="3" fill="#a855f7" opacity="0.4"/>
      <circle cx="660" cy="150" r="3" fill="#22c55e">
        <animate attributeName="r" values="3;7;3" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="680" cy="150" r="3" fill="#a855f7" opacity="0.4"/>
      <circle cx="700" cy="150" r="3" fill="#a855f7" opacity="0.4"/>
      <circle cx="720" cy="150" r="3" fill="#a855f7" opacity="0.4"/>
      <circle cx="740" cy="150" r="3" fill="#a855f7" opacity="0.4"/>
      <circle cx="600" cy="170" r="3" fill="#a855f7" opacity="0.4"/>
      <circle cx="620" cy="170" r="3" fill="#a855f7" opacity="0.4"/>
      <circle cx="640" cy="170" r="3" fill="#a855f7" opacity="0.4"/>
      <circle cx="660" cy="170" r="3" fill="#a855f7" opacity="0.4"/>
      <circle cx="680" cy="170" r="3" fill="#a855f7" opacity="0.4"/>
      <circle cx="700" cy="170" r="3" fill="#a855f7" opacity="0.4"/>
      <circle cx="720" cy="170" r="3" fill="#a855f7" opacity="0.4"/>
      <circle cx="740" cy="170" r="3" fill="#a855f7" opacity="0.4"/>
    </g>
    <text x="675" y="210" text-anchor="middle" class="vs-dim">408 entries · 3 matches</text>
    <text x="675" y="226" text-anchor="middle" class="vs-dim">phash distance ≤ 8</text>
    <text x="675" y="246" text-anchor="middle" class="vs-accent">→ HTTP API</text>
  </g>
  <!-- Bottom: query -->
  <text x="32" y="280" class="vs-title">QUERY: similar-to(input.mp4)</text>
  <line x1="32" y1="288" x2="768" y2="288" stroke="#1f1f23"/>
  <rect x="32" y="304" width="730" height="20" rx="3" fill="#1f1f23"/>
  <rect x="32" y="304" width="540" height="20" rx="3" class="vs-bar"/>
  <text x="40" y="318" class="vs-dim">similarity</text>
  <text x="700" y="318" class="vs-accent">0.94</text>
  <rect x="32" y="332" width="730" height="20" rx="3" fill="#1f1f23"/>
  <rect x="32" y="332" width="430" height="20" rx="3" class="vs-bar"/>
  <text x="40" y="346" class="vs-dim">similarity</text>
  <text x="700" y="346" class="vs-accent">0.76</text>
  <rect x="32" y="360" width="730" height="20" rx="3" fill="#1f1f23"/>
  <rect x="32" y="360" width="370" height="20" rx="3" class="vs-bar"/>
  <text x="40" y="374" class="vs-dim">similarity</text>
  <text x="700" y="374" class="vs-accent">0.65</text>
  <text x="32" y="408" class="vs-dim">results: 3 matches · 408 candidates · 12ms · ed25519 verified</text>
  <text x="32" y="426" class="vs-dim">endpoint: POST /search · body: {vector, k, threshold} · streaming NDJSON</text>
</svg>