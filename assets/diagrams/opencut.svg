
<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OpenCut v3 pipeline" style="width:100%;height:auto;max-width:900px;display:block">
  <defs>
    <linearGradient id="opencut-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1917"/><stop offset="1" stop-color="#431407"/>
    </linearGradient>
  </defs>
  <rect width="900" height="360" fill="url(#opencut-bg)" rx="12"/>
  <text x="32" y="40" fill="#fdba74" font-family="ui-monospace,monospace" font-size="12" letter-spacing="0.08em">OPENCUT v3 v0.6.5  /  20-STAGE PIPELINE</text>

  <!-- Domains on the left -->
  <g font-family="ui-monospace,monospace" font-size="11" fill="#a8a29e">
    <rect x="32" y="80" width="160" height="240" rx="10" fill="#292524" stroke="#78716c"/>
    <text x="112" y="105" text-anchor="middle" font-weight="700" fill="#fdba74" font-size="13">DOMAINS</text>
    <text x="112" y="135" text-anchor="middle">education</text>
    <text x="112" y="155" text-anchor="middle">travel</text>
    <text x="112" y="175" text-anchor="middle">knowledge_paid</text>
    <text x="112" y="195" text-anchor="middle">custom</text>
    <text x="112" y="240" text-anchor="middle" fill="#78716c" font-size="10">configurable</text>
    <text x="112" y="258" text-anchor="middle" fill="#78716c" font-size="10">prompt pack</text>
    <text x="112" y="276" text-anchor="middle" fill="#78716c" font-size="10">+ per-domain</text>
    <text x="112" y="294" text-anchor="middle" fill="#78716c" font-size="10">storyboard</text>
  </g>

  <!-- Stages on the right (linear flow) -->
  <g font-family="ui-monospace,monospace" font-size="11" fill="#fafaf9">
    <text x="210" y="105" fill="#a8a29e">INPUT</text>
    <rect x="210" y="115" width="100" height="40" rx="6" fill="#292524" stroke="#a8a29e"/>
    <text x="260" y="140" text-anchor="middle">image(s)</text>

    <text x="210" y="180" fill="#a8a29e">PROCESS</text>
    <rect x="210" y="190" width="100" height="40" rx="6" fill="#7c2d12" stroke="#fb923c"/>
    <text x="260" y="215" text-anchor="middle">TTS / script</text>

    <rect x="325" y="190" width="100" height="40" rx="6" fill="#7c2d12" stroke="#fb923c"/>
    <text x="375" y="215" text-anchor="middle">BGM match</text>

    <rect x="440" y="190" width="100" height="40" rx="6" fill="#7c2d12" stroke="#fb923c"/>
    <text x="490" y="215" text-anchor="middle">captions</text>

    <text x="565" y="180" fill="#a8a29e">RENDER</text>
    <rect x="565" y="190" width="120" height="40" rx="6" fill="#1c1917" stroke="#22c55e" stroke-width="2"/>
    <text x="625" y="215" text-anchor="middle" fill="#86efac">Remotion</text>

    <rect x="700" y="190" width="170" height="40" rx="6" fill="#0a0a0a" stroke="#fbbf24" stroke-width="2"/>
    <text x="785" y="215" text-anchor="middle" fill="#fbbf24" font-weight="700">1080x1920 vertical</text>

    <text x="210" y="260" fill="#a8a29e">DISTRIBUTE</text>
    <rect x="210" y="270" width="140" height="40" rx="6" fill="#292524" stroke="#a8a29e"/>
    <text x="280" y="295" text-anchor="middle">CLI</text>
    <rect x="365" y="270" width="140" height="40" rx="6" fill="#292524" stroke="#a8a29e"/>
    <text x="435" y="295" text-anchor="middle">SaaS</text>
  </g>

  <!-- Arrows -->
  <g stroke="#a8a29e" stroke-width="1.5" fill="none">
    <path d="M310 210 L325 210" marker-end="url(#arrow-oc)"/>
    <path d="M425 210 L440 210" marker-end="url(#arrow-oc)"/>
    <path d="M540 210 L565 210" marker-end="url(#arrow-oc)"/>
    <path d="M685 210 L700 210" marker-end="url(#arrow-oc)"/>
  </g>
  <defs><marker id="arrow-oc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8a29e"/></marker></defs>

  <text x="32" y="345" fill="#78716c" font-family="ui-monospace,monospace" font-size="11">AI-assisted authoring  /  CLI + SaaS dual-track  /  multi-domain</text>
</svg>