
<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VidSlice architecture" style="width:100%;height:auto;max-width:900px;display:block">
  <defs>
    <linearGradient id="vidslice-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="900" height="320" fill="url(#vidslice-bg)" rx="12"/>
  <text x="32" y="40" fill="#c4b5fd" font-family="ui-monospace,monospace" font-size="12" letter-spacing="0.08em">VIDSLICE v0.7.10  /  MATERIAL VECTOR INDEX</text>

  <g font-family="system-ui" font-size="13" fill="#e9d5ff">
    <!-- Ingest -->
    <rect x="32" y="100" width="120" height="120" rx="10" fill="#1e1b4b" stroke="#a855f7" stroke-width="2"/>
    <text x="92" y="135" text-anchor="middle" font-weight="700">INGEST</text>
    <text x="92" y="158" text-anchor="middle" fill="#c4b5fd" font-size="11">CLI / HTTP</text>
    <text x="92" y="178" text-anchor="middle" fill="#c4b5fd" font-size="11">+ NDJSON events</text>

    <!-- Extract -->
    <rect x="172" y="100" width="120" height="120" rx="10" fill="#1e1b4b" stroke="#a855f7" stroke-width="2"/>
    <text x="232" y="135" text-anchor="middle" font-weight="700">EXTRACT</text>
    <text x="232" y="158" text-anchor="middle" fill="#c4b5fd" font-size="11">3 frames</text>
    <text x="232" y="178" text-anchor="middle" fill="#c4b5fd" font-size="11">parallel workers</text>

    <!-- Embed -->
    <rect x="312" y="100" width="120" height="120" rx="10" fill="#1e1b4b" stroke="#a855f7" stroke-width="2"/>
    <text x="372" y="135" text-anchor="middle" font-weight="700">EMBED</text>
    <text x="372" y="158" text-anchor="middle" fill="#c4b5fd" font-size="11">CLIP / ViT</text>
    <text x="372" y="178" text-anchor="middle" fill="#c4b5fd" font-size="11">+ perceptual hash</text>

    <!-- Sign -->
    <rect x="452" y="100" width="120" height="120" rx="10" fill="#1e1b4b" stroke="#22c55e" stroke-width="2"/>
    <text x="512" y="135" text-anchor="middle" font-weight="700">SIGN</text>
    <text x="512" y="158" text-anchor="middle" fill="#86efac" font-size="11">Ed25519</text>
    <text x="512" y="178" text-anchor="middle" fill="#86efac" font-size="11">attestation</text>

    <!-- Store -->
    <rect x="592" y="100" width="140" height="120" rx="10" fill="#1e1b4b" stroke="#a855f7" stroke-width="2"/>
    <text x="662" y="135" text-anchor="middle" font-weight="700">STORE</text>
    <text x="662" y="158" text-anchor="middle" fill="#c4b5fd" font-size="11">LanceDB</text>
    <text x="662" y="178" text-anchor="middle" fill="#c4b5fd" font-size="11">incremental updates</text>

    <!-- Serve -->
    <rect x="752" y="100" width="120" height="120" rx="10" fill="#1e1b4b" stroke="#3b82f6" stroke-width="2"/>
    <text x="812" y="135" text-anchor="middle" font-weight="700">SERVE</text>
    <text x="812" y="158" text-anchor="middle" fill="#93c5fd" font-size="11">HTTP API</text>
    <text x="812" y="178" text-anchor="middle" fill="#93c5fd" font-size="11">+ OpenCut compat</text>
  </g>

  <g stroke="#a855f7" stroke-width="2" fill="none">
    <path d="M152 160 L172 160" marker-end="url(#arrow-vs)"/>
    <path d="M292 160 L312 160" marker-end="url(#arrow-vs)"/>
    <path d="M432 160 L452 160" marker-end="url(#arrow-vs)"/>
    <path d="M572 160 L592 160" marker-end="url(#arrow-vs)"/>
    <path d="M732 160 L752 160" marker-end="url(#arrow-vs)"/>
  </g>
  <defs><marker id="arrow-vs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a855f7"/></marker></defs>

  <text x="32" y="260" fill="#a78bfa" font-family="ui-monospace,monospace" font-size="11">v0.5 read-compat  /  v0.6 write opt-in via --compat  /  408 tests</text>
</svg>