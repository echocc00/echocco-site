
<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NetSage architecture" style="width:100%;height:auto;max-width:900px;display:block">
  <defs>
    <linearGradient id="netsage-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#052e16"/><stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="900" height="480" fill="url(#netsage-bg)" rx="12"/>
  <text x="32" y="40" fill="#6ee7b7" font-family="ui-monospace,monospace" font-size="12" letter-spacing="0.08em">NETSAGE v0.1.1  /  AI NETWORK ENGINEER</text>

  <!-- Left: 8 agents -->
  <text x="32" y="80" fill="#64748b" font-family="ui-monospace,monospace" font-size="11">8 AGENTS</text>
  <g font-family="system-ui" font-size="12" fill="#d1fae5">
    <rect x="32" y="92" width="170" height="36" rx="6" fill="#064e3b" stroke="#10b981"/>
    <text x="117" y="115" text-anchor="middle">planner</text>
    <rect x="32" y="136" width="170" height="36" rx="6" fill="#064e3b" stroke="#10b981"/>
    <text x="117" y="159" text-anchor="middle">config_engineer</text>
    <rect x="32" y="180" width="170" height="36" rx="6" fill="#064e3b" stroke="#10b981"/>
    <text x="117" y="203" text-anchor="middle">validator</text>
    <rect x="32" y="224" width="170" height="36" rx="6" fill="#064e3b" stroke="#10b981"/>
    <text x="117" y="247" text-anchor="middle">troubleshooter</text>
    <rect x="32" y="268" width="170" height="36" rx="6" fill="#064e3b" stroke="#10b981"/>
    <text x="117" y="291" text-anchor="middle">deploy</text>
    <rect x="32" y="312" width="170" height="36" rx="6" fill="#064e3b" stroke="#10b981"/>
    <text x="117" y="335" text-anchor="middle">observer</text>
    <rect x="32" y="356" width="170" height="36" rx="6" fill="#064e3b" stroke="#10b981"/>
    <text x="117" y="379" text-anchor="middle">security_auditor</text>
    <rect x="32" y="400" width="170" height="36" rx="6" fill="#064e3b" stroke="#10b981"/>
    <text x="117" y="423" text-anchor="middle">compliance</text>
  </g>

  <!-- Arrow to gates -->
  <g stroke="#10b981" stroke-width="2" fill="none">
    <path d="M202 268 L240 268" marker-end="url(#arrow-net)"/>
  </g>
  <defs><marker id="arrow-net" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10b981"/></marker></defs>

  <!-- Middle: 3 gates -->
  <text x="250" y="80" fill="#64748b" font-family="ui-monospace,monospace" font-size="11">3 GATES  (every change passes all 3)</text>
  <g font-family="system-ui" font-size="13" fill="#fff">
    <rect x="250" y="100" width="200" height="80" rx="8" fill="#022c22" stroke="#22c55e" stroke-width="2"/>
    <text x="350" y="135" text-anchor="middle" font-weight="700">GATE 1  /  Containerlab</text>
    <text x="350" y="158" text-anchor="middle" fill="#86efac" font-size="11">topology simulation</text>
    <rect x="250" y="200" width="200" height="80" rx="8" fill="#022c22" stroke="#22c55e" stroke-width="2"/>
    <text x="350" y="235" text-anchor="middle" font-weight="700">GATE 2  /  Batfish</text>
    <text x="350" y="258" text-anchor="middle" fill="#86efac" font-size="11">config validation + ACL</text>
    <rect x="250" y="300" width="200" height="80" rx="8" fill="#022c22" stroke="#22c55e" stroke-width="2"/>
    <text x="350" y="335" text-anchor="middle" font-weight="700">GATE 3  /  Human + Snapshot</text>
    <text x="350" y="358" text-anchor="middle" fill="#86efac" font-size="11">approval + rollback</text>
  </g>

  <!-- Arrow to outputs -->
  <g stroke="#10b981" stroke-width="2" fill="none">
    <path d="M450 240 L490 240" marker-end="url(#arrow-net)"/>
  </g>

  <!-- Right: vendors + SoT -->
  <text x="500" y="80" fill="#64748b" font-family="ui-monospace,monospace" font-size="11">MULTI-VENDOR  /  SOURCE OF TRUTH</text>
  <g font-family="system-ui" font-size="13" fill="#d1fae5">
    <rect x="500" y="100" width="370" height="60" rx="8" fill="#0f172a" stroke="#3b82f6"/>
    <text x="685" y="125" text-anchor="middle" font-weight="700">Huawei VRP</text>
    <text x="685" y="145" text-anchor="middle" fill="#94a3b8" font-size="11">Cisco IOS-XE  /  H3C  /  Juniper  /  Arista</text>
    <rect x="500" y="180" width="370" height="60" rx="8" fill="#0f172a" stroke="#3b82f6"/>
    <text x="685" y="205" text-anchor="middle" font-weight="700">NetBox  +  Nautobot</text>
    <text x="685" y="225" text-anchor="middle" fill="#94a3b8" font-size="11">dual SourceOfTruth adapter</text>
    <rect x="500" y="260" width="370" height="60" rx="8" fill="#0f172a" stroke="#22c55e"/>
    <text x="685" y="285" text-anchor="middle" font-weight="700">30 baseline rules</text>
    <text x="685" y="305" text-anchor="middle" fill="#94a3b8" font-size="11">CIS + vendor hardening</text>
    <rect x="500" y="340" width="370" height="60" rx="8" fill="#0f172a" stroke="#22c55e"/>
    <text x="685" y="365" text-anchor="middle" font-weight="700">RBAC 5 levels</text>
    <text x="685" y="385" text-anchor="middle" fill="#94a3b8" font-size="11">viewer / operator / engineer / admin / auditor</text>
  </g>

  <text x="32" y="455" fill="#475569" font-family="ui-monospace,monospace" font-size="11">3-stage pipeline  /  agent-native  /  audit-first</text>
</svg>